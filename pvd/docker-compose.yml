services:
  mysql:
    image: mysql:8.0
    container_name: mi_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mi_basedatos
      MYSQL_USER: usuario
      MYSQL_PASSWORD: clave123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: